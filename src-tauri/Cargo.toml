[package]
name = "blueprint-ide"
version = "0.1.0"
description = "Tauri 2 desktop shell for Blueprint IDE."
authors = ["Blueprint IDE"]
edition = "2021"

[lib]
name = "blueprint_ide_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
