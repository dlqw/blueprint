name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag points to a commit on main
        shell: bash
        run: |
          git fetch origin main --depth=1
          TAG_COMMIT="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/main"; then
            echo "::error::Tag ${GITHUB_REF_NAME} must be created from main (tag commit $TAG_COMMIT is not contained in origin/main)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: npm ci

      - name: Build & publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Blueprint IDE ${{ github.ref_name }}'
          releaseBody: 'See [changelog](https://github.com/${{ github.repository }}/blob/main/changelogs/).'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
